<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- script-src is 'self' only — React is vendored, no third-party script origin.
       style-src keeps unsafe-inline for cd-theme's injected <style>. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
  <meta name="robots" content="index, follow">
  <title>Ali Tahir — Console Dossier</title>
  <meta name="description" content="Ali Tahir — software engineer. Projects, field notes, and career trajectory, filed as a console dossier.">
  <link rel="canonical" href="https://pakfro.dev/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pakfro.dev/">
  <meta property="og:title" content="Ali Tahir — Console Dossier">
  <meta property="og:description" content="Ali Tahir — software engineer. Projects, field notes, and career trajectory, filed as a console dossier.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ali Tahir — Console Dossier">
  <meta name="twitter:description" content="Ali Tahir — software engineer. Projects, field notes, and career trajectory, filed as a console dossier.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #08080a; }
  </style>
  <!-- Production React 18.3.1 (minified), vendored in vendor/ — see vendor/README.md to update.
       Self-hosted so the site has no third-party script origin and survives a CDN outage.
       No in-browser Babel — JSX is precompiled into build/*.js -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!-- Compiled output of the cd-*.jsx files. Load order is load-bearing:
       tweaks-panel + cd-theme define globals the pages use; cd-app renders last. -->
  <script src="build/tweaks-panel.js"></script>
  <script src="build/cd-theme.js"></script>
  <script src="build/cd-home.js"></script>
  <script src="build/cd-detail.js"></script>
  <script src="build/cd-projects.js"></script>
  <script src="build/cd-fieldnotes.js"></script>
  <script src="build/cd-trajectory.js"></script>
  <script src="build/cd-about.js"></script>
  <script src="build/cd-hire.js"></script>
  <script src="build/cd-app.js"></script>
</body>
</html>
